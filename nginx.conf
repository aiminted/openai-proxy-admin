server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: any unknown path resolves to index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed Vite assets; the index never gets cached.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }
}
